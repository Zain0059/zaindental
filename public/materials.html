<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أوردر وبورصة ماتريال العيادة</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--tx:#1b2430;--mut:#6b7785;--pr:#0f8a7e;--bd:#e1e6ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#1a232c;--tx:#e8edf2;--mut:#93a0ad;--bd:#2a3642}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;font-size:15px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pr);color:#fff;padding:10px 12px;z-index:5}
header h1{font-size:17px;margin:0 0 8px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.tabs button{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:16px;padding:6px 12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
#list{padding:10px 12px 90px}
.it{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.it .n{flex:1;line-height:1.5}.it .p{color:var(--pr);font-weight:700}
.q{display:flex;align-items:center;gap:6px}
.q button,.add{border:0;background:var(--pr);color:#fff;border-radius:8px;min-width:34px;height:34px;font:inherit;font-size:18px;cursor:pointer}
.add{font-size:14px;padding:0 12px}
.bar{position:fixed;bottom:0;inset-inline:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.bar button,.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--mut)}
.pg{display:none;padding:12px;max-width:720px;margin:auto}
.pg.on{display:block}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{border:1px solid var(--bd);padding:7px;text-align:right}
.tot{font-size:18px;font-weight:700;margin:12px 0}
label{display:block;margin:10px 0 4px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media print{header,.tabs,.bar,.noprint{display:none!important}body{background:#fff;color:#000}.pg{display:none}#inv.on{display:block}}
</style>
</head>
<body>
<div id="shop">
<header><h1>🦷 أوردر وبورصة ماتريال العيادة</h1><input id="q" placeholder="ابحث عن صنف..." oninput="render()"></header>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<div class="bar"><div><b id="cnt">0</b> صنف — <b id="sum">0</b> ج</div><button onclick="show('cart')">السلة ←</button></div>
</div>

<div id="cart" class="pg">
<h2>السلة</h2><div id="cartbody"></div>
<div class="tot">الإجمالي: <span id="ctot">0</span> ج</div>
<div class="row"><button class="btn g" onclick="show('shop')">→ رجوع للأصناف</button><button class="btn" onclick="show('co')">إتمام الطلب</button></div>
</div>

<div id="co" class="pg">
<h2>بيانات التوصيل</h2>
<label>الاسم</label><input id="nm">
<label>رقم الموبايل 1</label><input id="p1" type="tel" inputmode="tel">
<label>رقم الموبايل 2</label><input id="p2" type="tel" inputmode="tel">
<label>العنوان بالتفصيل</label><textarea id="ad" rows="3"></textarea>
<div class="row"><button class="btn g" onclick="show('cart')">→ رجوع</button><button class="btn" onclick="makeInv()">إنشاء الفاتورة</button></div>
</div>

<div id="inv" class="pg">
<h2>فاتورة أوردر</h2><div id="invinfo"></div>
<table id="invt"></table><div class="tot" id="invtot"></div>
<div class="row noprint"><button class="btn" onclick="window.print()">📄 تحميل PDF / طباعة</button><button class="btn" onclick="wa()">إرسال واتساب</button><button class="btn g" onclick="show('shop')">أوردر جديد</button></div>
<p class="noprint" style="color:var(--mut);font-size:13px">من نافذة الطباعة اختار "حفظ كـ PDF". الأسعار غير شاملة الشحن.</p>
</div>

const items=RAW.split("\n").map((l,i)=>{const [c,n,p]=l.split("|");return{id:i,c,n,p:+p}});
const cats=["الكل",...new Set(items.map(i=>i.c))];
let cat="الكل",cart={};
try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("ar-EG");
function save(){try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}}
function show(id){["shop","cart","co","inv"].forEach(x=>{const e=$(x);if(e){x==="shop"?e.style.display=id==="shop"?"block":"none":e.classList.toggle("on",x===id)}});if(id==="cart")renderCart();window.scrollTo(0,0)}
function tabs(){$("tabs").innerHTML=cats.map(c=>`<button class="${c===cat?"on":""}" onclick="cat='${c}';tabs();render()">${c}</button>`).join("")}
function render(){const s=$("q").value.trim().toLowerCase();
$("list").innerHTML=items.filter(i=>(cat==="الكل"||i.c===cat)&&i.n.toLowerCase().includes(s)).map(i=>{const q=cart[i.id]||0;
return `<div class="it"><div class="n">${i.n}<div class="p">${fmt(i.p)} ج</div></div>${q?`<div class="q"><button onclick="ch(${i.id},-1)">−</button><b>${q}</b><button onclick="ch(${i.id},1)">+</button></div>`:`<button class="add" onclick="ch(${i.id},1)">أضف</button>`}</div>`}).join("")||"<p style='text-align:center;padding:20px;color:var(--mut)'>لا توجد نتائج مطابقة</p>";tot()}
function ch(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();render();if($("cart").classList.contains("on"))renderCart()}
function lines(){return Object.keys(cart).map(id=>({...items[id],q:cart[id]}))}
function total(){return lines().reduce((a,l)=>a+l.p*l.q,0)}
function tot(){$("cnt").textContent=fmt(Object.keys(cart).length);$("sum").textContent=fmt(total())}
function renderCart(){const L=lines();$("cartbody").innerHTML=L.length?L.map(l=>`<div class="it"><div class="n">${l.n}<div class="p">${fmt(l.p*l.q)} ج</div></div><div class="q"><button onclick="ch(${l.id},-1)">−</button><b>${l.q}</b><button onclick="ch(${l.id},1)">+</button></div></div>`).join(""):"<p style='text-align:center;padding:20px;color:var(--mut)'>السلة فاضية</p>";$("ctot").textContent=fmt(total())}
function makeInv(){
if(!Object.keys(cart).length)return alert("السلة فاضية");
const nm=$("nm").value.trim(),p1=$("p1").value.trim(),ad=$("ad").value.trim();
if(!nm||!p1||!ad)return alert("اكتب الاسم ورقم موبايل والعنوان");
$("invinfo").innerHTML=`<p>التاريخ: ${new Date().toLocaleDateString("ar-EG")}<br>الاسم: ${nm}<br>الموبايل: ${p1}${$("p2").value?" - "+$("p2").value:""}<br>العنوان: ${ad}</p>`;
$("invt").innerHTML="<tr><th>الصنف</th><th>العدد</th><th>السعر</th><th>الإجمالي</th></tr>"+lines().map(l=>`<tr><td>${l.n}</td><td>${l.q}</td><td>${fmt(l.p)}</td><td>${fmt(l.p*l.q)}</td></tr>`).join("");
$("invtot").textContent="الإجمالي: "+fmt(total())+" ج (بدون شحن)";show("inv")}
function wa(){let t="أوردر جديد\n";lines().forEach(l=>t+=`- ${l.n} × ${l.q} = ${l.p*l.q}ج\n`);t+=`الإجمالي: ${total()}ج\nالاسم: ${$("nm").value}\nموبايل: ${$("p1").value} ${$("p2").value}\nالعنوان: ${$("ad").value}`;window.open("https://wa.me/?text="+encodeURIComponent(t))}
tabs();render();
</script>
